name: release
# Builds Yakusu.exe (one file, tools packed inside). Push a tag like v0.2.0
# to publish it on the Releases page; run it by hand to just get the file.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test -p yakusu-core 2>&1 | tee test.log || {
            grep -E "panicked at|^test .* FAILED|^error|left:|right:|Err\(" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Fetch the bundled tools
        run: powershell -ExecutionPolicy Bypass -File packaging\fetch_tools.ps1
      - run: cargo install tauri-cli --version "^2" --locked
      - name: Build Yakusu.exe
        run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: Yakusu
          path: target/release/Yakusu.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/Yakusu.exe
          prerelease: ${{ contains(github.ref_name, '-') }}
