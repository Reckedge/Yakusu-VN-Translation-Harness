name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test -p yakusoku-core 2>&1 | tee test.log || {
            # Surface the failures as annotations (readable without the log).
            grep -E "panicked at|^test .* FAILED|^error|left:|right:|Err\(" test.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - run: powershell -ExecutionPolicy Bypass -File packaging\fetch_tools.ps1
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri build
        working-directory: src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: Yakusoku-windows
          path: target/release/bundle/nsis/*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: target/release/bundle/nsis/*.exe }
